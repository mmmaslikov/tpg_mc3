<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Инструкция для участников ТПГ «ГенИИ»: соберите промт, обсудите план с Qwen и опубликуйте страницу своей сферы в каталоге «Точка ИИ».">
<title>Страница вашей сферы · инструкция ТПГ «ГенИИ» · Точка ИИ</title>
<style>
/* ============ ПАЛИТРА КАТАЛОГА «ТОЧКА ИИ» ============ */
:root{
  --bg:#f2f2f2; --m2:#e6e6e6; --charcoal:#2f2d2c;
  --surface:#ffffff; --surface-2:#fafafa;
  --text:#1d1d1f; --muted:#6f6f6f;
  --line:rgba(0,0,0,.10);
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --hero-acc:#4da3ff; --ok:#248a3d;
  --violet:#8944ab; --green:#248a3d; --teal:#0071a4;
  --radius:22px; --shadow:0 12px 34px rgba(0,0,0,.10);
  --nav-h:62px; --pad:clamp(16px,4vw,44px); --wrap:1100px; --zoom:1;
  --sb-track:#e6e6e6; --sb-thumb:#c7c7cc; --sb-hover:#a1a1a6;
}
@media (min-width:1800px){:root{--zoom:1.2}}
html{zoom:var(--zoom)}
[data-theme="dark"]{
  --bg:#161616; --m2:#1d1d1d; --charcoal:#232120;
  --surface:#222222; --surface-2:#2a2a2a; --text:#f2f2f2; --muted:#9c9c9c;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --hero-acc:#2997ff; --ok:#30d158;
  --violet:#bf5af2; --green:#30d158; --teal:#64d2ff;
  --shadow:0 14px 40px rgba(0,0,0,.5);
  --sb-track:#1d1d1d; --sb-thumb:#3a3a3c; --sb-hover:#545456;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:8px;border:2px solid var(--sb-track)}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover)}
body{margin:0;background:var(--bg);color:var(--text);
  font:16.5px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.sec{padding:clamp(44px,6vw,84px) 0;scroll-margin-top:calc(var(--nav-h) + 14px)}
.sec--m2{background:var(--m2)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc,var(--accent));margin-bottom:12px}
.kicker::before{content:"";width:22px;height:2px;background:var(--acc,var(--accent));border-radius:2px}
.sec-title{font-size:clamp(24px,3.4vw,40px);font-weight:700}
.sec-lead{color:var(--muted);margin-top:12px;max-width:760px;font-size:clamp(15px,1.5vw,17.5px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:980px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .18s,opacity .18s,background .18s}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{opacity:.92;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.tint{background:color-mix(in srgb,var(--acc,var(--accent)) 13%,transparent);color:var(--acc,var(--accent));border-color:color-mix(in srgb,var(--acc,var(--accent)) 30%,transparent)}
.btn.tint:hover{background:color-mix(in srgb,var(--acc,var(--accent)) 20%,transparent);opacity:1}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--acc,var(--accent));border-color:var(--acc,var(--accent));opacity:1}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}}
.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent),var(--violet),var(--green));transition:width .1s linear}
/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);background:var(--charcoal);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:var(--nav-h);display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.85);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:10px;min-height:40px;transition:all .18s;flex:none}
.back:hover{color:#fff;background:rgba(255,255,255,.1)}
.back svg{width:15px;height:15px}
.brand{display:inline-flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;flex:none}
.brand .bm{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0b3ea8,#3f97f0)}
.brand .bm svg{width:17px;height:17px}
.nav-links{display:none;gap:2px;margin-left:auto}
.nav-links a{color:rgba(255,255,255,.72);text-decoration:none;font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:9px;min-height:40px;display:inline-flex;align-items:center;border-bottom:2px solid transparent}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.active{color:#fff;border-bottom-color:var(--hero-acc);border-radius:0}
@media (min-width:900px){.nav-links{display:flex}}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
@media (min-width:900px){.nav-links + .nav-actions{margin-left:6px}}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .18s}
.icon-btn:hover{transform:scale(1.06)}
.icon-btn svg{width:18px;height:18px}
/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;padding:clamp(44px,7vw,92px) 0 clamp(40px,6vw,72px)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 90% at 82% 12%,rgba(77,163,255,.14),transparent 60%),radial-gradient(70% 70% at 8% 96%,rgba(137,68,171,.12),transparent 62%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(80% 80% at 70% 30%,#000,transparent 75%)}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;gap:clamp(24px,4vw,52px);align-items:center}
@media (min-width:960px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}
.hero h1{font-size:clamp(30px,5vw,58px);font-weight:600;color:#fff;max-width:640px}
.hero-sub{margin-top:14px;font-size:clamp(15px,1.7vw,19px);color:rgba(255,255,255,.7);line-height:1.5}
.hero-sub span{display:block}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn.line{background:transparent;color:var(--hero-acc);border:1.5px solid var(--hero-acc)}
.btn.line:hover{background:rgba(77,163,255,.14);opacity:1}
.btn.dim{background:transparent;color:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.35)}
.btn.dim:hover{border-color:#fff;color:#fff;opacity:1}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.hero-chips .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.85)}
.mock{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:#26242e;box-shadow:0 24px 60px rgba(0,0,0,.45);transform:rotate(1.2deg);transition:transform .5s}
.mock:hover{transform:rotate(0deg) translateY(-4px)}
.mock-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1d1b24;border-bottom:1px solid rgba(255,255,255,.1)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:#3a3a3c}
.mock-bar i:first-child{background:#ff5f57}.mock-bar i:nth-child(2){background:#febc2e}.mock-bar i:nth-child(3){background:#28c840}
.mock-bar span{margin-left:6px;font-size:11px;color:rgba(255,255,255,.5);font-family:ui-monospace,Menlo,Consolas,monospace}
.mock-body{padding:16px}
.mock-hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:#2f2d38;border-left:3px solid var(--mock-acc,#0a84ff)}
.mock-hero .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--mock-acc,#0a84ff) 22%,transparent);color:var(--mock-acc,#0a84ff)}
.mock-hero .mi svg{width:20px;height:20px}
.mock-hero b{display:block;font-size:14px;color:#fff}
.mock-hero small{display:block;font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.mock-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.mock-tabs i{height:26px;border-radius:8px;background:#34323e;border:1px solid rgba(255,255,255,.1);flex:1;min-width:52px}
.mock-tabs i.on{background:color-mix(in srgb,var(--mock-acc,#0a84ff) 26%,transparent);border-color:var(--mock-acc,#0a84ff)}
.mock-cards{display:grid;gap:8px}
.mock-cards i{height:44px;border-radius:10px;background:#2f2d38;border:1px solid rgba(255,255,255,.08);border-top:3px solid var(--mock-acc,#0a84ff)}
.mock-cards i:nth-child(2){border-top-color:#30d158}
.mock-cards i:nth-child(3){border-top-color:#bf5af2}
/* ============ ШАГИ ============ */
.phases{display:grid;gap:16px;margin-top:28px}
@media (min-width:900px){.phases{grid-template-columns:1fr 1fr}}
.phase{padding:clamp(18px,2.4vw,26px);border-top:4px solid var(--acc);display:flex;flex-direction:column;gap:14px}
.phase-head{display:flex;align-items:center;gap:12px}
.phase-head .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.phase-head .pi svg{width:22px;height:22px}
.phase-head h3{font-size:18px}
.phase-head small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.steps li{position:relative;padding-left:42px;counter-increment:st;color:var(--muted);font-size:14.5px;line-height:1.5}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:27px;height:27px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.steps li b{color:var(--text);font-weight:600}
.repo-card{margin-top:16px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-top:4px solid var(--teal)}
.repo-card .ri{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}
.repo-card .ri svg{width:22px;height:22px}
.repo-card .rt{flex:1;min-width:220px}
.repo-card .rt b{display:block;font-size:15.5px}
.repo-card .rt small{display:block;color:var(--muted);font-size:13px;margin-top:2px;word-break:break-all}
.repo-card .ra{display:flex;gap:8px;flex-wrap:wrap}
/* ============ КОНСТРУКТОР ============ */
.builder{display:grid;gap:18px;margin-top:28px}
.panel{padding:clamp(18px,2.4vw,26px);display:grid;gap:18px;border-top:4px solid var(--violet)}
.panel h3{font-size:17px;display:flex;align-items:center;gap:10px}
.panel h3 .hi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.panel h3 .hi svg{width:18px;height:18px}
.sphere-tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stile{--sc:var(--accent);--ink:color-mix(in srgb,var(--sc) 74%,var(--text));display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;min-height:52px;transition:all .18s;line-height:1.25}
.stile .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--ink)}
.stile .si svg{width:16px;height:16px}
.stile:hover{border-color:var(--sc);color:var(--text)}
.stile.on{border-color:var(--sc);color:var(--ink);background:color-mix(in srgb,var(--sc) 10%,transparent);box-shadow:inset 0 -2px 0 var(--sc)}
.reqcard{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--teal) 8%,var(--surface-2));border:1px dashed color-mix(in srgb,var(--teal) 45%,var(--line))}
.reqcard .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.reqcard .qi svg{width:18px;height:18px}
.reqcard b{font-size:14px;display:block}
.reqcard p{font-size:13px;color:var(--muted);margin-top:3px}
.reqcard a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;word-break:break-all;margin-top:6px}
.reqcard a svg{width:14px;height:14px;flex:none}
.toggles{display:grid;gap:8px}
@media (min-width:700px){.toggles{grid-template-columns:1fr 1fr}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;min-height:46px}
.tgl .tl{font-size:13.5px;font-weight:600;color:var(--text)}
.tgl .ts{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl .sw{width:42px;height:24px;border-radius:980px;background:var(--sb-thumb);position:relative;flex:none;transition:background .2s}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl input:checked + .sw{background:var(--ok)}
.tgl input:checked + .sw::after{left:21px}
.tgl input:focus-visible + .sw{outline:3px solid var(--accent);outline-offset:2px}
.tc-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tc-row .tl{font-size:14px;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.stepper button{width:40px;height:40px;border:0;background:transparent;color:var(--acc,var(--accent));font-size:18px;font-weight:700;cursor:pointer;transition:background .15s}
.stepper button:hover:not(:disabled){background:color-mix(in srgb,var(--acc,var(--accent)) 12%,transparent)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper .val{min-width:44px;text-align:center;font-weight:700;font-size:15px;color:var(--text);border-left:1px solid var(--line);border-right:1px solid var(--line);height:40px;line-height:40px}
.tabs-editor{display:grid;gap:12px}
.tabed{--sc:var(--violet);--ink:color-mix(in srgb,var(--sc) 74%,var(--text));border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:14px;background:var(--surface-2);padding:14px 16px;display:grid;gap:12px}
.tabed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabed-head .tn{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.tabed-head .autochip{font-size:11px;padding:3px 9px;border-radius:980px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--ink);font-weight:700}
.emo-group{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.emo{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;transition:all .15s}
.emo:hover{border-color:var(--sc);transform:translateY(-1px)}
.emo.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);box-shadow:inset 0 -2px 0 var(--sc)}
.tabed-grid{display:grid;gap:10px}
@media (min-width:760px){.tabed-grid{grid-template-columns:minmax(0,1fr) auto}}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field textarea{width:100%;font:14px/1.55 inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field textarea{min-height:76px;resize:vertical;font-family:inherit;scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
.field input:focus,.field textarea:focus{outline:3px solid var(--accent);outline-offset:2px}
.shot-field{display:grid;gap:6px;align-content:start}
.shot-field .sl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.shot-field .hint{font-size:11.5px;color:var(--muted);max-width:190px}
.preview{padding:clamp(18px,2.4vw,24px);display:grid;gap:14px;border-top:4px solid var(--accent)}
.preview-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.preview-head h3{font-size:17px;flex:1}
.preview-head .cnt{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.preview pre{margin:0;max-height:60vh;overflow:auto;padding:16px 18px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--text);scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
.preview-actions{display:flex;gap:8px;flex-wrap:wrap}
.stage2{padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--green) 8%,var(--surface-2));border:1px dashed color-mix(in srgb,var(--green) 45%,var(--line));display:grid;gap:10px}
.stage2 b{font-size:13.5px;color:var(--green)}
.stage2 pre{margin:0;max-height:120px;overflow:auto;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--muted)}
/* ============ ПУБЛИКАЦИЯ ============ */
.pub{display:grid;gap:16px;margin-top:28px}
@media (min-width:900px){.pub{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.pub-steps{padding:clamp(18px,2.4vw,26px);border-top:4px solid var(--green)}
.pub-side{display:grid;gap:16px;align-content:start}
.linkcard{padding:20px;display:flex;gap:14px;align-items:flex-start;border-top:4px solid var(--teal)}
.linkcard .li{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}
.linkcard .li svg{width:22px;height:22px}
.linkcard b{display:block;font-size:15.5px}
.linkcard p{color:var(--muted);font-size:13.5px;margin-top:4px}
.linkcard .btn{margin-top:12px}
/* ============ ЧЕК-ЛИСТ ============ */
.check-wrap{margin-top:28px;display:grid;gap:16px}
@media (min-width:900px){.check-wrap{grid-template-columns:minmax(0,1fr) 300px}}
.checklist{padding:clamp(18px,2.4vw,26px);border-top:4px solid var(--acc);display:grid;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;transition:all .18s}
.chk:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--sb-thumb);flex:none;display:grid;place-items:center;color:#fff;transition:all .18s;margin-top:1px}
.chk .box svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:all .18s}
.chk input:checked ~ .box{background:var(--acc);border-color:var(--acc)}
.chk input:checked ~ .box svg{opacity:1;transform:scale(1)}
.chk input:focus-visible ~ .box{outline:3px solid var(--accent);outline-offset:2px}
.chk .ct{font-size:14px;color:var(--muted);line-height:1.5}
.chk input:checked ~ .ct{color:var(--text)}
.check-side{padding:22px;display:grid;gap:14px;align-content:start;border-top:4px solid var(--acc)}
@media (min-width:900px){.check-side{position:sticky;top:calc(var(--nav-h) + 16px)}}
.check-side .ring{font-size:34px;font-weight:700;color:var(--acc)}
.check-side .bar{height:10px;border-radius:980px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.check-side .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
.check-side p{color:var(--muted);font-size:13.5px}
/* ============ FOOTER ============ */
.footer{background:var(--charcoal);color:#fff;padding:clamp(32px,5vw,56px) 0}
.footer-in{display:grid;gap:16px;justify-items:center;text-align:center}
.f-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);text-decoration:none;font-size:14px;font-weight:600;min-height:42px}
.f-link:hover{color:#fff;border-color:#fff}
.f-link svg{width:15px;height:15px}
.f-copy{color:rgba(255,255,255,.55);font-size:14px;line-height:1.6}
.f-copy span{display:inline}
@media (max-width:700px){.f-copy span{display:block}.f-copy .f-sep{display:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:300;padding:12px 22px;border-radius:12px;background:var(--charcoal);color:#fff;border:1px solid rgba(255,255,255,.18);font-size:14.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

function startTab(s){

function rebuildTabs(){
  const s=sphere();
  state.tabs=(state.start?[startTab(s)]:[]).concat(seedTabs(s));
  if(state.tabs.length>6)state.tabs=state.tabs.slice(0,6);
  if(state.tabs.length<2)state.tabs.push({name:"Новая вкладка",emo:"📚",content:"",services:"",shots:0});
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
async function copyText(txt,msg){
  try{await navigator.clipboard.writeText(txt);toast(msg||"Скопировано");}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast(msg||"Скопировано");}catch(err){toast("Скопируйте вручную из поля ниже");}
    document.body.removeChild(ta);}
}
function blockText(s){
  return [`const MO={title:"${s.title}",`,`  sub:["${s.sub0}","Страница каталога «Точка ИИ»"],`,`  head:"${s.head}",icon:"${s.icon}"};`,`/* --hero-acc: ${s.color} */`,`${s.icon}:'${ICONS[s.icon]}',`].join("\n");
}
function briefText(){
  const s=sphere();const L=[];
  L.push("Сфера: "+s.full);
  L.push("Куратор(ы): "+s.head);
  L.push("Количество вкладок: "+state.tabs.length);
  state.tabs.forEach((t,i)=>{
    L.push("Вкладка "+(i+1)+": «"+(t.name.trim()||"без названия")+"» "+t.emo+(t.start?" (стартовая)":""));
    L.push("  Содержание: "+(t.content.trim()||"не заполнено — предложи сам, опираясь на запросы сферы"));
    L.push("  Сервисы и ссылки этой вкладки: "+(t.services.trim()||"не указаны — предложи подходящие сам"));
    L.push("  Скриншоты/картинки: "+t.shots+" шт. — имена файлов и подписи придумай сам (shot-"+s.id+"-N.png), в конце перечисли, куда их положить");
  });
  L.push("Конструктор промтов: "+(state.cons?"нужен":"не нужен"));
  return L.join("\n");
}

  L.push("- Если брифа не хватает — задай не более 7 уточняющих вопросов (темы, сервисы, ссылки, количество скриншотов, нужен ли конструктор) и дождись ответов.");
  L.push("- Согласуй со мной план и дождись команды «Собирай».");

  L.push("ЭТАП 2 — СБОРКА (после команды «Собирай», в режиме артефактов с прикреплённым index.html):");
  L.push("ПРАВИЛА:");

  L.push("");
  L.push("ФОРМАТ ДАННЫХ (карточка может сочетать любые поля):");
  L.push(FORMAT);

  L.push("БЛОК МОЕЙ СФЕРЫ (вставь как есть; строку со значком добавь внутрь объекта ICONS):");
  L.push(blockText(s));

  return L.join("\n");

        <article class="card linkcard rv" style="--acc:var(--accent)">
          <span class="li">${ICONS.shield}</span>
          <span><b>Безопасность прежде всего</b><p>Никаких ФИО, оценок, фото и диагнозов учеников в промтах и на странице. Только обезличенные примеры и коды.</p>
          <a class="btn tint" style="--acc:var(--accent)" href="${MAIN_URL}#safety">Раздел «Безопасность» ${ICONS.ext}</a></span>
        </article>
      </div>
    </div>
  </div></section>

  <section class="sec sec--m2" id="check" style="--acc:var(--teal)"><div class="wrap">
    <span class="kicker">Перед отправкой</span>
    <h2 class="sec-title">Чек-лист куратору</h2>
    <p class="sec-lead">Отмечайте пункты по мере проверки — прогресс сохраняется в браузере.</p>
    <div class="check-wrap">
      <div class="card checklist" id="checklist"></div>
      <aside class="card check-side">
        <span class="ring" id="check-ring">0 / 5</span>
        <div class="bar"><i id="check-bar"></i></div>
        <p id="check-note">Пройдите все пункты перед отправкой ссылки куратору.</p>
        <button class="btn ghost sm" type="button" id="check-reset">${ICONS.refresh} Сбросить отметки</button>
      </aside>
    </div>
  </div></section>
  </main>
  <footer class="footer"><div class="wrap footer-in">
    <a class="f-link" href="${MAIN_URL}">${ICONS.left} Вернуться в «Точку ИИ»</a>
    <p class="f-copy"><span>Вопросы и готовые ссылки — куратору ТПГ: Масликов Михаил Михайлович</span><span class="f-sep"> · </span><span>ЧОУ «Точка будущего»</span></p>
    <p class="f-copy"><span>© 2026 ТПГ «ГенИИ»</span><span class="f-sep"> · </span><span>Каталог «Точка ИИ»</span></p>
  </div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  renderTiles();renderTabs();renderChecklist();
  updatePrompt();updateChecks();applyTheme();
}
function renderTiles(){
  $("#tiles").innerHTML=SPHERES.map(s=>`
    <button class="stile${s.id===state.sphere?" on":""}" type="button" data-sphere="${s.id}" style="--sc:${s.color}" aria-pressed="${s.id===state.sphere}">
      <span class="si">${ICONS[s.icon]}</span>${esc(s.title)}
    </button>`).join("");
}
function renderTabs(){
  const sc=sphere().color;
  $("#tc-val").textContent=state.tabs.length;
  $("#tc-dec").disabled=state.tabs.length<=2;
  $("#tc-inc").disabled=state.tabs.length>=6;
  $("#tabs").innerHTML=state.tabs.map((t,i)=>`
    <div class="tabed" data-tab="${i}" style="--sc:${sc}">
      <div class="tabed-head">
        <span class="tn">Вкладка ${i+1}</span>
        ${t.start?'<span class="autochip">стартовая</span>':""}
        <span class="emo-group" role="group" aria-label="Эмодзи вкладки ${i+1}">
          ${EMOJIS.map(e=>`<button class="emo${t.emo===e?" on":""}" type="button" data-emo="${e}" aria-pressed="${t.emo===e}" title="${e}">${e}</button>`).join("")}
        </span>
      </div>
      <div class="tabed-grid">
        <div class="field">
          <label for="tn-${i}">Название вкладки</label>
          <input type="text" id="tn-${i}" data-tname="${i}" value="${esc(t.name)}" placeholder="Например: Промты и сервисы">
          <label for="tc-${i}" style="margin-top:10px">Что внутри</label>
          <textarea id="tc-${i}" data-tcontent="${i}" placeholder="Карточки, алгоритмы, промты, ссылки — что показать на этой вкладке…">${esc(t.content)}</textarea>
          <label for="ts-${i}" style="margin-top:10px">Мои сервисы и ссылки этой вкладки</label>
          <textarea id="ts-${i}" data-tservices="${i}" style="min-height:56px" placeholder="Например: Qwen — промты; Gamma — презентации; ссылка на кабинет…">${esc(t.services||"")}</textarea>
        </div>
        <div class="shot-field">
          <span class="sl">Скриншоты, шт.</span>
          <span class="stepper" style="--acc:${sc}">
            <button type="button" data-sdec="${i}" aria-label="Меньше скриншотов" ${t.shots<=0?"disabled":""}>−</button>
            <span class="val">${t.shots}</span>
            <button type="button" data-sinc="${i}" aria-label="Больше скриншотов" ${t.shots>=8?"disabled":""}>+</button>
          </span>
          <span class="hint">Имена файлов и подписи придумает Qwen и скажет, куда их положить.</span>
        </div>
      </div>
    </div>`).join("");
}
function renderChecklist(){
  $("#checklist").innerHTML=CHECKS.map((c,i)=>`
    <label class="chk"><input type="checkbox" data-check="${i}" ${state.checks[i]?"checked":""}>
      <span class="box">${ICONS.check}</span><span class="ct">${esc(c)}</span></label>`).join("");
}
function updatePrompt(){
  const txt=buildPrompt();
  $("#prompt-out").textContent=txt;
  $("#cnt").textContent=txt.length+" символов";
  const mock=$("#mock");if(mock)mock.style.setProperty("--mock-acc",sphere().color);
}
function updateChecks(){
  const n=state.checks.filter(Boolean).length;
  $("#check-ring").textContent=n+" / "+CHECKS.length;
  $("#check-bar").style.width=(n/CHECKS.length*100)+"%";
  $("#check-note").textContent=n===CHECKS.length?"Всё готово — отправляйте ссылку куратору.":"Пройдите все пункты перед отправкой ссылки куратору.";
}
function saveChecks(){try{localStorage.setItem("tpg_guide_checks",JSON.stringify(state.checks));}catch(e){}}
function loadChecks(){try{const v=JSON.parse(localStorage.getItem("tpg_guide_checks"));if(Array.isArray(v))state.checks=CHECKS.map((_,i)=>!!v[i]);}catch(e){}}
function resolvedTheme(){return state.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):state.theme;}
function applyTheme(){document.documentElement.dataset.theme=resolvedTheme();
  const b=$("#theme-btn");if(b){b.innerHTML=resolvedTheme()==="dark"?ICONS.sun:ICONS.moon;b.setAttribute("aria-label",resolvedTheme()==="dark"?"Светлая тема":"Тёмная тема");}}
function toggleTheme(){state.theme=resolvedTheme()==="dark"?"light":"dark";try{localStorage.setItem("tpg_guide_theme",state.theme);}catch(e){}applyTheme();}
function initReveal(){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}}),{threshold:.1});
  $$(".rv:not(.in)").forEach(el=>io.observe(el));
}
function initSpy(){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){$$(".nav-links a").forEach(a=>a.classList.toggle("active",a.dataset.spy===en.target.id));}}),{rootMargin:"-40% 0px -55% 0px"});
  ["how","builder","publish","check"].forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el);});
}
function initProgress(){
  const bar=$("#progress");
  const on=()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight);bar.style.width=Math.min(100,Math.max(0,p*100))+"%";};
  addEventListener("scroll",on,{passive:true});on();
}
async function downloadEngine(btn){
  const old=btn.innerHTML;btn.disabled=true;btn.innerHTML=ICONS.download+" Скачиваем…";
  try{
    const r=await fetch(RAW_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("http "+r.status);
    const txt=await r.text();
    const blob=new Blob([txt],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("index.html скачан — прикрепите его на этапе сборки");
  }catch(e){window.open(REPO_URL,"_blank","noopener");toast("Открыл страницу репозитория — скачайте файл оттуда");}
  btn.disabled=false;btn.innerHTML=old;
}
function pickSphere(id){
  state.sphere=id;rebuildTabs();
  renderTiles();renderTabs();updatePrompt();
  toast("Сфера: "+sphere().title);
}
function bindHandlers(){
  $("#theme-btn").addEventListener("click",toggleTheme);
  $("#hero-dl").addEventListener("click",e=>downloadEngine(e.currentTarget));
  $("#repo-dl").addEventListener("click",e=>downloadEngine(e.currentTarget));
  $("#tiles").addEventListener("click",e=>{const t=e.target.closest("[data-sphere]");if(t)pickSphere(t.dataset.sphere);});
  $("#tg-cons").addEventListener("change",e=>{state.cons=e.target.checked;updatePrompt();});
  $("#tg-start").addEventListener("change",e=>{
    state.start=e.target.checked;
    if(state.start){state.tabs.unshift(startTab(sphere()));}
    else{state.tabs=state.tabs.filter(t=>!t.start);}
    if(state.tabs.length<2)state.tabs.push({name:"Новая вкладка",emo:"📚",content:"",services:"",shots:0});
    if(state.tabs.length>6)state.tabs=state.tabs.slice(0,6);
    renderTabs();updatePrompt();
    toast(state.start?"Вкладка «С чего начать» добавлена первой":"Вкладка «С чего начать» убрана");
  });
  $("#tc-dec").addEventListener("click",()=>{if(state.tabs.length>2){state.tabs.pop();renderTabs();updatePrompt();}});
  $("#tc-inc").addEventListener("click",()=>{if(state.tabs.length<6){state.tabs.push({name:"Новая вкладка",emo:"📚",content:"",services:"",shots:0});renderTabs();updatePrompt();}});
  $("#tabs").addEventListener("click",e=>{
    const em=e.target.closest("[data-emo]");
    if(em){const i=+em.closest("[data-tab]").dataset.tab;state.tabs[i].emo=em.dataset.emo;renderTabs();updatePrompt();return;}
    const dec=e.target.closest("[data-sdec]");
    if(dec){const i=+dec.dataset.sdec;if(state.tabs[i].shots>0){state.tabs[i].shots--;renderTabs();updatePrompt();}return;}
    const inc=e.target.closest("[data-sinc]");
    if(inc){const i=+inc.dataset.sinc;if(state.tabs[i].shots<8){state.tabs[i].shots++;renderTabs();updatePrompt();}return;}
  });
  $("#tabs").addEventListener("input",e=>{
    const n=e.target.closest("[data-tname]");
    if(n){state.tabs[+n.dataset.tname].name=n.value;updatePrompt();return;}
    const c=e.target.closest("[data-tcontent]");
    if(c){state.tabs[+c.dataset.tcontent].content=c.value;updatePrompt();return;}
    const s=e.target.closest("[data-tservices]");
    if(s){state.tabs[+s.dataset.tservices].services=s.value;updatePrompt();return;}
  });
  $("#brief-reseed").addEventListener("click",()=>{rebuildTabs();renderTabs();updatePrompt();toast("Образец наполнения возвращён");});
  $("#copy-prompt").addEventListener("click",()=>copyText(buildPrompt(),"Промт скопирован — отправьте его в Qwen"));
  $("#copy-stage2").addEventListener("click",()=>copyText(STAGE2_MSG,"Сообщение этапа 2 скопировано"));
  $("#reset-all").addEventListener("click",()=>{
    state.cons=true;state.start=true;$("#tg-cons").checked=true;$("#tg-start").checked=true;
    rebuildTabs();renderTabs();updatePrompt();toast("Параметры сброшены");
  });
  $("#checklist").addEventListener("change",e=>{const c=e.target.closest("[data-check]");if(!c)return;state.checks[+c.dataset.check]=c.checked;saveChecks();updateChecks();});
  $("#check-reset").addEventListener("click",()=>{state.checks=CHECKS.map(()=>false);saveChecks();renderChecklist();updateChecks();toast("Отметки сброшены");});
}
function init(){
  try{const t=localStorage.getItem("tpg_guide_theme");if(t==="light"||t==="dark")state.theme=t;}catch(e){}
  loadChecks();
  rebuildTabs();
  renderApp();bindHandlers();initSpy();initProgress();initReveal();
}
init();
</script>
</body>
</html>
